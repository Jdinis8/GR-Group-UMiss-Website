---
layout: default
---
<article>
  <header class="page-hero"><div class="shell page-hero-inner"><p class="eyebrow">{% if page.archive %}From the archive{% else %}News{% endif %} · {{ page.date | date: '%B %d, %Y' }}</p><h1>{{ page.title }}</h1>{% if page.excerpt %}<p class="page-intro">{{ page.excerpt | strip_html }}</p>{% endif %}</div></header>
  <div class="shell prose page-body">{{ content }}</div>
</article>
