- date_iso: '2026-04-13'
  speaker: Dr. Aditya Vijaykumar
  affiliation: Canadian Institute for Theoretical Astrophysics
  title: Subpopulations of hierarchical mergers in gravitational-wave data and their
    implications
  abstract: The most recent observing run of the LIGO–Virgo–KAGRA gravitational-wave
    detectors has presented multiple lines of evidence hinting at hierarchical mergers
    in the data. This talk gives an overview of the hierarchical-merger subpopulation,
    concentrating on spin, mass-ratio, and redshift distributions. It also considers
    theoretical interpretations in the context of binary evolution in dense star clusters
    and examines whether hierarchical mergers can explain observed correlations between
    effective spin, mass ratio, and redshift.
