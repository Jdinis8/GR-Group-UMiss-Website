- number: "01"
  title: Gravitational-wave astronomy
  description: We use current and future gravitational-wave observations to study compact objects, cosmology, and gravity.
  slug: gravitational-waves
- number: "02"
  title: Compact binaries & waveforms
  description: We model eccentric, spinning, and precessing compact binaries with analytical and numerical relativity.
  slug: compact-objects
- number: "03"
  title: Strong-field gravity
  description: We test general relativity around black holes and neutron stars and search for signs of new gravitational physics.
  slug: strong-field-gravity
- number: "04"
  title: Relativistic jets
  description: We combine radio observations, polarimetry, theory, and simulations to study plasma jets launched by black holes.
  slug: relativistic-jets
- number: "05"
  title: Quantum spacetime & geometry
  description: We study causal structure, quantum gravity, curved spacetime, and the geometry underlying gravitational phenomena.
  slug: spacetime-foundations
- number: "06"
  title: Field theory & bootstrap
  description: We use effective field theory, scattering amplitudes, positivity, and bootstrap methods to study consistency in physical theories.
  slug: field-theory-bootstrap
