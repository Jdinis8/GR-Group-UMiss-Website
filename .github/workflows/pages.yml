name: Build and deploy Jekyll site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  umiss:
    runs-on: ubuntu-latest
    # This `needs` is actually a lie... but I don't want to risk two instances
    # of `jekyll buld` with different configs trying to write to the same _site
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build  --config _config.yml,_config_UMiss.yml
        env:
          JEKYLL_ENV: production
      - name: rsync deployment
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: _site/
          remote_path: ${{ secrets.REMOTE_PATH }} # ex: /var/www/html/
          remote_host: ${{ secrets.REMOTE_HOST }} # ex: example.com
          remote_port: ${{ secrets.REMOTE_PORT }} # ex: 22
          remote_user: ${{ secrets.REMOTE_USER }} # ex: ubuntu
          remote_key: ${{ secrets.REMOTE_PRIVATE_KEY }}
