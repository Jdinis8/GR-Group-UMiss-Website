name: Refresh publications

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: Earliest publication date to import
        required: false
        default: "1980-01-01"

permissions:
  contents: write

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch works from OpenAlex and INSPIRE
        run: python3 scripts/fetch_publications.py --since "${{ inputs.since || '1980-01-01' }}" --prune
        env:
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
      - name: Commit publication updates
        run: |
          if git diff --quiet -- _publications; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _publications
          git commit -m "Update publications"
          git push
