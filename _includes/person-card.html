{% assign person = include.person %}
<article class="person-card" data-role="{{ person.role }}">
  <a class="person-photo" href="{{ person.url | relative_url }}" aria-label="View {{ person.name }}’s profile">
    {% if person.photo %}
      <img src="{{ person.photo | relative_url }}" alt="Portrait of {{ person.name }}" loading="lazy" width="560" height="680">
    {% else %}
      <span class="photo-placeholder" aria-hidden="true"><span>{{ person.name | slice: 0 }}</span></span>
    {% endif %}
    <span class="role-pill">{{ person.role_label }}</span>
  </a>
  <div class="person-card-body">
    <h3><a href="{{ person.url | relative_url }}">{{ person.name }}</a></h3>
    {% if person.research and person.research.size > 0 %}<p>{{ person.research | first }}</p>{% endif %}
    <a class="text-link" href="{{ person.url | relative_url }}">Profile <span aria-hidden="true">↗</span></a>
  </div>
</article>
