title: Gravity & Astrophysics at Ole Miss
short_title: UM Gravity
description: >-
  We study gravity from quantum spacetime and fundamental field theory to
  compact binaries, gravitational waves, and relativistic black-hole jets.
# LCS: Leave url commented out here; github will build this to deploy in its own
# default github-pages place. Then we override it with the file
# _config_UMiss.yml which has our *official* deployment site.
# url: "https://jdinis8.github.io"
baseurl: "/GR-Group-UMiss-Website"
lang: en
timezone: America/Chicago

markdown: kramdown
permalink: pretty

collections:
  people:
    output: true
    permalink: /people/:name/
  projects:
    output: true
    permalink: /research/:name/
  publications:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: people
    values:
      layout: person
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
  - .venv

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
